<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandwtch Dammam</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 15%, rgba(236, 72, 153, 0.2), transparent 32%),
          radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.18), transparent 32%),
          #111827;
      }

      main {
        width: min(100%, 480px);
        padding: 42px 28px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background: rgba(17, 24, 39, 0.78);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(14px);
      }

      h1 { margin: 0 0 10px; font-size: clamp(1.7rem, 5vw, 2.35rem); }
      p { margin: 0 0 30px; color: #cbd5e1; }

      .works-strip {
        position: relative;
        overflow: hidden;
        margin: 0 0 28px;
        padding: 13px 0;
        border: 1px solid rgba(34, 211, 238, 0.28);
        border-radius: 14px;
        background: linear-gradient(110deg, rgba(8, 145, 178, 0.14), rgba(17, 24, 39, 0.92), rgba(8, 145, 178, 0.14));
      }

      .works-strip::before,
      .works-strip::after {
        position: absolute;
        z-index: 1;
        top: 0;
        bottom: 0;
        width: 28px;
        content: "";
        pointer-events: none;
      }

      .works-strip::before { right: 0; background: linear-gradient(270deg, #111827, transparent); }
      .works-strip::after { left: 0; background: linear-gradient(90deg, #111827, transparent); }

      .works-track {
        display: flex;
        width: max-content;
        animation: works-scroll 22s linear infinite;
      }

      .works-group {
        display: flex;
        flex: none;
        align-items: center;
        gap: 18px;
        padding-inline: 16px;
        white-space: nowrap;
      }

      .works-item { color: #e0f2fe; font-size: 0.96rem; font-weight: 700; }
      .works-label { color: #67e8f9; }
      .works-dot { color: #22d3ee; font-size: 1.15rem; }

      @keyframes works-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .social-links { display: flex; justify-content: center; gap: 16px; }

      .social-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 152px;
        justify-content: center;
        padding: 13px 18px;
        color: #fff;
        text-decoration: none;
        border-radius: 13px;
        font-weight: 700;
        transition: transform 160ms ease-out, box-shadow 160ms ease-out;
      }

      .social-link:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25); }
      .social-link:focus-visible { outline: 3px solid #f9fafb; outline-offset: 3px; }
      .instagram { background: linear-gradient(135deg, #f9ce34, #ee2a7b 48%, #6228d7); }
      .tiktok { background: #09090b; border: 1px solid #3f3f46; }
      svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      @media (max-width: 420px) {
        .social-links { flex-direction: column; }
        .social-link { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .social-link { transition: none; }
        .works-track { animation: none; width: 100%; justify-content: center; }
        .works-group { justify-content: center; flex-wrap: wrap; white-space: normal; gap: 8px 12px; }
        .works-group[aria-hidden="true"] { display: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sandwtch Dammam</h1>
      <p>تابعونا على منصات التواصل الاجتماعي</p>
      <section class="works-strip" aria-label="أهم أعمالنا: ساندوتش بانل، هناجر، غرف، ملاحق">
        <span class="sr-only">أهم أعمالنا: ساندوتش بانل، هناجر، غرف، ملاحق</span>
        <div class="works-track" aria-hidden="true">
          <div class="works-group">
            <span class="works-item works-label">أهم أعمالنا</span>
            <span class="works-dot">•</span>
            <span class="works-item">ساندوتش بانل</span>
            <span class="works-dot">•</span>
            <span class="works-item">هناجر</span>
            <span class="works-dot">•</span>
            <span class="works-item">غرف</span>
            <span class="works-dot">•</span>
            <span class="works-item">ملاحق</span>
          </div>
          <div class="works-group" aria-hidden="true">
            <span class="works-item works-label">أهم أعمالنا</span>
            <span class="works-dot">•</span>
            <span class="works-item">ساندوتش بانل</span>
            <span class="works-dot">•</span>
            <span class="works-item">هناجر</span>
            <span class="works-dot">•</span>
            <span class="works-item">غرف</span>
            <span class="works-dot">•</span>
            <span class="works-item">ملاحق</span>
          </div>
        </div>
      </section>
      <nav class="social-links" aria-label="روابط التواصل الاجتماعي">
        <a class="social-link instagram" href="https://www.instagram.com/hangar_dammam_ksa?stkn=NGlpNTBma3B5bXEx" target="_blank" rel="noopener noreferrer" aria-label="تابعنا على إنستقرام">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" /></svg>
          <span>إنستقرام</span>
        </a>
        <a class="social-link tiktok" href="https://www.tiktok.com/@hangars_panel_ksa" target="_blank" rel="noopener noreferrer" aria-label="تابعنا على تيك توك">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4v10.5a4.5 4.5 0 1 1-4-4.47" /><path d="M15 4c.5 2.4 2 3.8 4.5 4" /></svg>
          <span>تيك توك</span>
        </a>
      </nav>
    </main>
  </body>
</html>
